name: Quality

on:
  push:
    branches:
      - main
  pull_request: {}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    name: PHP ${{ matrix.php }} checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.3'
          - '8.4'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, fileinfo
          coverage: none

      - name: Validate Composer metadata
        run: composer validate --no-check-publish

      - name: Install development dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run unit tests
        run: composer test

      - name: Audit dependencies
        run: composer audit

      - name: Run JavaScript regression tests
        run: node --test tests/*.test.js

      - name: Lint PHP files
        run: find . -path ./vendor -prune -o -path ./dist -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Check JavaScript syntax
        run: node --check public/js/brandpulse.js

      - name: Validate plugin XML
        run: |
          php -r 'exit(simplexml_load_file("brandpulse.xml") === false ? 1 : 0);'

      - name: Verify release packaging
        run: ./scripts/build-release.sh
